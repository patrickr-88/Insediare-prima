name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and later are Apple Silicon runners; macos-13 is Intel.
          - { os: windows-latest, label: "Windows 11 x64", python: "3.11" }
          - { os: macos-13, label: "macOS Intel", python: "3.11" }
          - { os: macos-14, label: "macOS Apple Silicon", python: "3.11" }
          - { os: ubuntu-latest, label: "Linux (engine only)", python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Report the detected platform
        run: python -m usbinstaller --repository repository --info

      - name: Unit and integration tests
        run: python -m pytest tests --cov --cov-report=term-missing --cov-report=xml

      - name: Platform suite (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/windows -v -m "windows or not windows"

      - name: Platform suite (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest tests/macos -v -m "macos or not macos"

      - name: Demo repository end-to-end (POSIX)
        if: runner.os != 'Windows'
        run: |
          python tools/make_demo_repository.py build/demo-usb --force
          python -m usbinstaller --repository build/demo-usb --list
          python -m usbinstaller --repository build/demo-usb --install-all --dry-run
          python -m usbinstaller --repository build/demo-usb --install-all --yes || true
          python -m usbinstaller --repository build/demo-usb --retry --yes || true

      - name: Demo repository end-to-end (Windows)
        if: runner.os == 'Windows'
        run: |
          python tools/make_demo_repository.py build/demo-usb --force
          python -m usbinstaller --repository build/demo-usb --list
          python -m usbinstaller --repository build/demo-usb --install-all --dry-run

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests tools
      - name: ruff format check
        run: ruff format --check src tests tools
        continue-on-error: true
      - name: mypy
        run: mypy || true

  coverage-gate:
    name: Coverage gate (90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests --cov --cov-fail-under=90 -q

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[build]"
      - name: Build executables
        run: python tools/build.py ${{ runner.os == 'macOS' && '--universal2' || '' }}
        shell: bash
      - name: Smoke-test the built CLI (Windows)
        if: runner.os == 'Windows'
        run: dist/USBInstaller.exe --version
      - name: Smoke-test the built CLI (macOS)
        if: runner.os == 'macOS'
        run: dist/USBInstaller --version
      - uses: actions/upload-artifact@v4
        with:
          name: USBInstaller-${{ runner.os }}
          path: dist/*.zip
