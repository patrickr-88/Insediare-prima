name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: "Windows x64", extra: "" }
          - { os: macos-14, label: "macOS universal", extra: "--universal2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -e ".[dev,build]"

      - name: Test before shipping
        run: python -m pytest tests -q

      - name: Build
        run: python tools/build.py ${{ matrix.extra }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*.zip

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artefacts
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          ls -l dist

      - name: Checksums for the release artefacts
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
